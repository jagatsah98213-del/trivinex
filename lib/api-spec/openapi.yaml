openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Trivenix Partners digital services agency API
servers:
- url: /api
  description: Base API path
tags:
- name: health
- name: auth
- name: public
- name: admin
- name: media
- name: ai
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      description: Returns server health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Log in as admin or employee
      parameters:
      - name: key
        in: query
        required: false
        description: Admin access key required when an admin access key is configured
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Log out
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - auth
      summary: Get the current logged-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/services:
    get:
      operationId: listPublicServices
      tags:
      - public
      summary: List active services
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
  /public/services/{slug}/plans:
    get:
      operationId: listPublicServicePlans
      tags:
      - public
      summary: List active plans for a service
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePlan'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/portfolio:
    get:
      operationId: listPublicPortfolioItems
      tags:
      - public
      summary: List portfolio items, optionally filtered by service category
      parameters:
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ServiceCategory'
      responses:
        '200':
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioItem'
  /public/testimonials:
    get:
      operationId: listPublicTestimonials
      tags:
      - public
      summary: List published testimonials
      responses:
        '200':
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Testimonial'
  /public/meeting-slots:
    get:
      operationId: listPublicMeetingSlots
      tags:
      - public
      summary: List open consultation slots
      responses:
        '200':
          description: Open slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
  /public/inquiries:
    post:
      operationId: createInquiry
      tags:
      - public
      summary: Submit a client quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInquiryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInquiry'
  /public/meeting-bookings:
    post:
      operationId: createMeetingBooking
      tags:
      - public
      summary: Book a free consultation slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingBookingInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBooking'
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags:
      - admin
      summary: Admin dashboard summary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
  /admin/meeting-slots:
    get:
      operationId: listAdminMeetingSlots
      tags:
      - admin
      summary: List consultation slots
      responses:
        '200':
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
    post:
      operationId: createAdminMeetingSlot
      tags:
      - admin
      summary: Open a consultation slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
  /admin/meeting-slots/{id}:
    patch:
      operationId: updateAdminMeetingSlot
      tags:
      - admin
      summary: Update a consultation slot
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
  /admin/meeting-bookings:
    get:
      operationId: listAdminMeetingBookings
      tags:
      - admin
      summary: List consultation bookings
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingBooking'
  /admin/meeting-bookings/{id}:
    patch:
      operationId: updateAdminMeetingBooking
      tags:
      - admin
      summary: Confirm, reschedule, or cancel a consultation booking
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingBookingUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBooking'
  /admin/inquiries:
    get:
      operationId: listAdminInquiries
      tags:
      - admin
      summary: List client inquiries
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientInquiry'
  /admin/inquiries/{id}:
    delete:
      operationId: deleteAdminInquiry
      tags:
      - admin
      summary: Permanently delete a client inquiry record
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateAdminInquiry
      tags:
      - admin
      summary: Update a client inquiry's status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInquiry'
  /admin/inquiries/{id}/convert-to-project:
    post:
      operationId: convertInquiryToProject
      tags:
      - admin
      summary: Convert a client inquiry into a project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertInquiryInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /admin/projects:
    get:
      operationId: listAdminProjects
      tags:
      - admin
      summary: List projects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: createAdminProject
      tags:
      - admin
      summary: Create a project directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /admin/projects/{id}:
    delete:
      operationId: deleteAdminProject
      tags:
      - admin
      summary: Permanently delete a project record
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateAdminProject
      tags:
      - admin
      summary: Update a project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /admin/services:
    get:
      operationId: listAdminServices
      tags:
      - admin
      summary: List all services
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      operationId: createAdminService
      tags:
      - admin
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
  /admin/services/{id}:
    patch:
      operationId: updateAdminService
      tags:
      - admin
      summary: Update a service
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
    delete:
      operationId: deleteAdminService
      tags:
      - admin
      summary: Delete a service
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
  /admin/service-plans:
    get:
      operationId: listAdminServicePlans
      tags:
      - admin
      summary: List plans for a service
      parameters:
      - name: serviceId
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePlan'
    post:
      operationId: createAdminServicePlan
      tags:
      - admin
      summary: Create a service plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePlanInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlan'
  /admin/service-plans/{id}:
    patch:
      operationId: updateAdminServicePlan
      tags:
      - admin
      summary: Update a service plan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePlanUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAdminServicePlan
      tags:
      - admin
      summary: Delete a service plan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
  /admin/portfolio-items:
    get:
      operationId: listAdminPortfolioItems
      tags:
      - admin
      summary: List all portfolio items
      responses:
        '200':
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioItem'
    post:
      operationId: createAdminPortfolioItem
      tags:
      - admin
      summary: Create a portfolio item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioItemInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItem'
  /admin/portfolio-items/{id}:
    patch:
      operationId: updateAdminPortfolioItem
      tags:
      - admin
      summary: Update a portfolio item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioItemUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItem'
    delete:
      operationId: deleteAdminPortfolioItem
      tags:
      - admin
      summary: Delete a portfolio item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
  /admin/testimonials:
    get:
      operationId: listAdminTestimonials
      tags:
      - admin
      summary: List all testimonials
      responses:
        '200':
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Testimonial'
    post:
      operationId: createAdminTestimonial
      tags:
      - admin
      summary: Create a testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestimonialInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Testimonial'
  /admin/testimonials/{id}:
    patch:
      operationId: updateAdminTestimonial
      tags:
      - admin
      summary: Update or publish a testimonial
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestimonialUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Testimonial'
    delete:
      operationId: deleteAdminTestimonial
      tags:
      - admin
      summary: Delete a testimonial
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags:
      - admin
      summary: Searchable history of sensitive admin actions
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
  /public/ai-chat:
    post:
      operationId: createAiChat
      tags:
      - ai
      summary: Ask the AI assistant about Trivenix Partners and the current page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatInput'
      responses:
        '200':
          description: AI assistant reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/media/upload:
    post:
      operationId: createMediaUpload
      tags:
      - media
      summary: Request a signed upload URL for a media asset (image/video)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadInput'
      responses:
        '200':
          description: Signed upload URL and asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          description: Invalid file request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    Role:
      type: string
      enum:
      - ADMIN
      - EMPLOYEE
    ServiceCategory:
      type: string
      enum:
      - WEB_DEVELOPMENT
      - VIDEO_EDITING
      - PHOTOGRAPHY
      - VIDEOGRAPHY
      - GRAPHIC_DESIGN
      - SCRIPT_CONTENT_WRITING
      - SEO
      - DIGITAL_MARKETING
      - PHOTOGRAPHY_VIDEOGRAPHY
      - SEO_DIGITAL_MARKETING
      - CONTENT_WRITING
    PayoutMethod:
      type: string
      enum:
      - BANK_TRANSFER
      - PHONEPE
      - PAYPAL
      - ESEWA
    SlotPurpose:
      type: string
      enum:
      - INTERVIEW
      - CLIENT_MEETING
    AuthLoginInput:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
    AuthUser:
      type: object
      required:
      - id
      - email
      - role
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        employeeId:
          type:
          - integer
          - 'null'
    Service:
      type: object
      required:
      - id
      - category
      - title
      - slug
      - description
      - isActive
      - sortOrder
      properties:
        id:
          type: integer
        category:
          $ref: '#/components/schemas/ServiceCategory'
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        longDescription:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        startingPrice:
          type:
          - string
          - 'null'
        metaTitle:
          type:
          - string
          - 'null'
        metaDescription:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        sortOrder:
          type: integer
        plans:
          type: array
          items:
            $ref: '#/components/schemas/ServicePlan'
    ServiceInput:
      type: object
      required:
      - category
      - title
      - slug
      - description
      properties:
        category:
          $ref: '#/components/schemas/ServiceCategory'
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        longDescription:
          type: string
        icon:
          type: string
        startingPrice:
          type: string
        metaTitle:
          type: string
        metaDescription:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer
    ServiceUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        longDescription:
          type: string
        icon:
          type: string
        startingPrice:
          type: string
        metaTitle:
          type: string
        metaDescription:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer
    PlanBadge:
      type: string
      enum:
      - NONE
      - HOT
      - NEW
      - POPULAR
      - BEST_VALUE
    PricingType:
      type: string
      enum:
      - ONE_TIME
      - MONTHLY
      - OTHER
    ServicePlan:
      type: object
      required:
      - id
      - serviceId
      - name
      - description
      - pricingType
      - badge
      - isActive
      - sortOrder
      properties:
        id:
          type: integer
        serviceId:
          type: integer
        name:
          type: string
        description:
          type: string
        pricingType:
          $ref: '#/components/schemas/PricingType'
        priceLabel:
          type:
          - string
          - 'null'
        startingPrice:
          type:
          - string
          - 'null'
        badge:
          $ref: '#/components/schemas/PlanBadge'
        isActive:
          type: boolean
        sortOrder:
          type: integer
    ServicePlanInput:
      type: object
      required:
      - serviceId
      - name
      - description
      properties:
        serviceId:
          type: integer
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        pricingType:
          $ref: '#/components/schemas/PricingType'
        priceLabel:
          type: string
        startingPrice:
          type: string
        badge:
          $ref: '#/components/schemas/PlanBadge'
        isActive:
          type: boolean
        sortOrder:
          type: integer
    ServicePlanUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        pricingType:
          $ref: '#/components/schemas/PricingType'
        priceLabel:
          type: string
        startingPrice:
          type: string
        badge:
          $ref: '#/components/schemas/PlanBadge'
        isActive:
          type: boolean
        sortOrder:
          type: integer
    PortfolioItem:
      type: object
      required:
      - id
      - serviceCategory
      - title
      - mediaType
      - mediaUrl
      - isFeatured
      - isPublished
      - sortOrder
      properties:
        id:
          type: integer
        serviceCategory:
          $ref: '#/components/schemas/ServiceCategory'
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        clientName:
          type:
          - string
          - 'null'
        mediaType:
          type: string

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary Meta -->
    <title>Trivinex Partners — Everything You Need, All in One Place</title>
    <meta name="description" content="Trivinex Partners is a one-stop digital services company offering web development, video editing, graphic designing, content writing, photography, videography, and SEO — delivered worldwide by one trusted team at honest prices." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="author" content="Trivinex Partners" />
    <meta name="keywords" content="web development, video editing, graphic designing, content writing, photography, videography, SEO, digital services, freelance agency, Trivinex Partners" />
    <link rel="canonical" href="https://trivinexpartners.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Trivinex Partners" />
    <meta property="og:url"         content="https://trivinexpartners.com/" />
    <meta property="og:title"       content="Trivinex Partners — Everything You Need, All in One Place" />
    <meta property="og:description" content="One team. Six services. Zero compromises. Web development, video editing, graphic designing, content writing, photography &amp; videography, and SEO — worldwide." />
    <meta property="og:image"       content="https://trivinexpartners.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@trivinexpartners" />
    <meta name="twitter:title"       content="Trivinex Partners — Everything You Need, All in One Place" />
    <meta name="twitter:description" content="One team. Six services. Zero compromises. Web development, video editing, graphic designing, content writing, photography &amp; videography, and SEO — worldwide." />
    <meta name="twitter:image"       content="https://trivinexpartners.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "ProfessionalService"],
      "@id": "https://trivinexpartners.com/#organization",
      "name": "Trivinex Partners",
      "alternateName": "Trivinex",
      "url": "https://trivinexpartners.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://trivinexpartners.com/favicon.png",
        "width": 512,
        "height": 512
      },
      "description": "Trivinex Partners is a one-stop digital services company offering web development, video editing, graphic designing, content writing, photography, videography, and SEO — delivered worldwide by one trusted team at honest prices.",
      "foundingDate": "2019",
      "areaServed": "Worldwide",
      "knowsLanguage": "English",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "trivinexpartners@gmail.com",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Video Editing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Graphic Designing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Content Writing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Photography & Videography" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO & Digital Marketing" } }
        ]
      }
    }
    </script>

    <!-- Global JSON-LD: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://trivinexpartners.com/#website",
      "url": "https://trivinexpartners.com",
      "name": "Trivinex Partners",
      "description": "One-stop digital services — web development, video editing, graphic designing, content writing, photography, videography, and SEO.",
      "publisher": { "@id": "https://trivinexpartners.com/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://trivinexpartners.com/services?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
